services:
  db:
    image: mysql:8.0
    container_name: scheduler_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_DATABASE: task_manager
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: scheduler_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: task_manager
      SECRET_KEY: ${SECRET_KEY:-please-change-this-secret-key}
      TZ: Asia/Shanghai
    ports:
      - "8082:8082"
    volumes:
      # 日志持久化
      - app_logs:/app/logs
      # 如需把备份存到宿主机，可在此挂载，例如：
      # - ./backups:/app/backups

volumes:
  db_data:
  app_logs:
